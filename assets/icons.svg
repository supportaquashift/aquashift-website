    <!-- Liquid-glass backdrop distortion, used by .liquid-glass (css/styles.css) on
         buttons over the hero video — a gentle water-ripple warp, on-brand for
         Aquashift. Subtle by design: strong distortion elsewhere reads as a gimmick
         and fights the text sitting on top of it. -->
    <filter id="liquid-glass-filter" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.018" numOctaves="2" seed="4" result="turbulence"/>
      <feGaussianBlur in="turbulence" stdDeviation="2" result="softTurbulence"/>
      <feDisplacementMap in="SourceGraphic" in2="softTurbulence" scale="16" xChannelSelector="R" yChannelSelector="G" result="displaced"/>
      <feGaussianBlur in="displaced" stdDeviation="5"/>
    </filter>
  </defs>
</svg>
